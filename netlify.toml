[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Admin panel — serve admin.html for all /admin/* routes
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# SPA catch-all for main app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
