<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Test Producto — Composición Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #c9963a;
    --gold2:  #f0c050;
    --gold3:  #ffe082;
    --dark:   #0a0700;
    --dark2:  #110d02;
    --card:   rgba(255,255,255,.04);
    --r: 14px;
  }

  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% 55%, rgba(120,75,0,.35) 0%, transparent 65%),
      linear-gradient(180deg, #0c0800 0%, #110d02 40%, #0a0600 100%);
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  /* ══ SCENE WRAPPER ══ */
  .scene {
    position: relative;
    width: min(920px, 100%);
    background: radial-gradient(ellipse 80% 65% at 50% 52%,
      rgba(140,90,0,.28) 0%,
      rgba(80,50,0,.14) 40%,
      transparent 70%);
    padding: 2.5rem 1.5rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ══ HEADER: logo + title ══ */
  .scene-header {
    text-align: center;
    margin-bottom: 1.2rem;
    position: relative;
    z-index: 5;
  }
  .brand-row {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: .6rem;
  }
  .brand-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1rem; color: #000;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .brand-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.3rem; font-weight: 900; letter-spacing: .12em;
    color: var(--gold2);
    text-transform: uppercase;
  }
  .scene-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,.8);
  }
  .scene-title .gold { color: var(--gold2); }

  .badge-top {
    display: inline-flex; align-items: center; gap: .4rem;
    background: linear-gradient(135deg, rgba(201,150,58,.18), rgba(240,192,80,.1));
    border: 1px solid rgba(201,150,58,.5);
    border-radius: 999px;
    padding: .3rem 1rem;
    font-size: .72rem; font-weight: 800; letter-spacing: .08em;
    color: var(--gold3);
    text-transform: uppercase;
    margin-top: .5rem;
  }

  /* ══ MAIN COMPOSITION ROW ══ */
  .composition {
    position: relative;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0;
    min-height: 380px;
  }

  /* ── LEFT COLUMN: star rating + reviews ── */
  .col-left {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1rem;
    padding-right: 1.5rem;
    z-index: 5;
  }

  /* ── RIGHT COLUMN: payment badges ── */
  .col-right {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .75rem;
    padding-left: 1.5rem;
    z-index: 5;
  }

  /* ── CENTER: product image ── */
  .col-center {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(360px, 56vw);
    height: min(360px, 56vw);
    z-index: 3;
  }

  /* radial glow behind product */
  .product-glow {
    position: absolute;
    inset: -10%;
    background: radial-gradient(ellipse 80% 80% at 50% 50%,
      rgba(201,150,58,.45) 0%,
      rgba(140,90,0,.22) 38%,
      transparent 68%);
    pointer-events: none;
    z-index: 1;
  }

  /* plataforma ya viene dentro del PNG transparente */
  .product-platform { display: none; }

  /* product image — PNG RGBA transparente, flota limpio sobre cualquier fondo */
  .product-img {
    position: relative; z-index: 3;
    width: 100%; height: 100%;
    object-fit: contain;
    animation: floatProd 4s ease-in-out infinite;
    filter:
      drop-shadow(0 0 42px rgba(201,150,58,.6))
      drop-shadow(0 28px 60px rgba(0,0,0,.5));
  }

  @keyframes floatProd {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  /* ══ INFO CARDS ══ */

  /* Stars card */
  .card-stars {
    background: linear-gradient(135deg,
      rgba(201,150,58,.18) 0%, rgba(120,80,0,.25) 100%);
    border: 1.5px solid rgba(201,150,58,.55);
    border-radius: var(--r);
    padding: 1rem 1.3rem;
    text-align: center;
    min-width: 130px;
    box-shadow: 0 4px 24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,220,100,.08);
  }
  .star-icon { font-size: 2.2rem; line-height: 1; margin-bottom: .25rem; }
  .star-num {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2.6rem; font-weight: 900; line-height: 1;
    color: var(--gold2);
  }
  .star-label {
    display: block;
    font-size: .68rem; font-weight: 800; letter-spacing: .1em;
    color: rgba(255,255,255,.6); text-transform: uppercase; margin-bottom: .3rem;
  }
  .stars-row { display: flex; gap: 2px; justify-content: center; }
  .stars-row span { color: var(--gold2); font-size: 1rem; }

  /* Reviews card */
  .card-reviews {
    background: linear-gradient(135deg,
      rgba(201,150,58,.16) 0%, rgba(120,80,0,.22) 100%);
    border: 1.5px solid rgba(201,150,58,.45);
    border-radius: var(--r);
    padding: .85rem 1.1rem;
    text-align: center;
    min-width: 130px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  .review-icon { font-size: 1.6rem; margin-bottom: .2rem; }
  .review-num {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.8rem; font-weight: 900; line-height: 1;
    color: var(--gold2);
  }
  .review-label {
    display: block;
    font-size: .62rem; font-weight: 800; letter-spacing: .09em;
    color: rgba(255,255,255,.55); text-transform: uppercase;
    line-height: 1.3;
  }

  /* Payment / shipping / discount cards (right side) */
  .card-promo {
    background: linear-gradient(135deg,
      rgba(201,150,58,.15) 0%, rgba(80,50,0,.3) 100%);
    border: 1.5px solid rgba(201,150,58,.4);
    border-radius: var(--r);
    padding: .7rem 1.1rem;
    display: flex;
    align-items: center;
    gap: .7rem;
    min-width: 170px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    transition: border-color .2s, transform .15s;
  }
  .card-promo:hover {
    border-color: rgba(240,192,80,.7);
    transform: translateX(3px);
  }
  .promo-icon { font-size: 1.5rem; flex-shrink: 0; }
  .promo-text {}
  .promo-val {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem; font-weight: 900; line-height: 1;
    color: var(--gold2);
  }
  .promo-desc {
    display: block;
    font-size: .62rem; font-weight: 700; letter-spacing: .07em;
    color: rgba(255,255,255,.55); text-transform: uppercase;
    line-height: 1.3;
  }

  /* discount circle */
  .card-discount {
    background: linear-gradient(135deg, rgba(201,150,58,.22), rgba(80,50,0,.35));
    border: 2px solid rgba(240,192,80,.6);
    border-radius: 50%;
    width: 76px; height: 76px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(201,150,58,.4);
    flex-shrink: 0;
  }
  .disc-pct {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.55rem; font-weight: 900; line-height: 1;
    color: var(--gold2);
  }
  .disc-label {
    font-size: .52rem; font-weight: 800; letter-spacing: .07em;
    color: rgba(255,255,255,.55); text-transform: uppercase;
  }

  /* ══ CTA BUTTON ══ */
  .cta-wrap {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    z-index: 5;
    position: relative;
  }
  .btn-cta {
    display: inline-flex;
    align-items: center; justify-content: center;
    gap: .6rem;
    background: linear-gradient(135deg, #c9963a 0%, #f0c050 45%, #c9963a 100%);
    background-size: 200% auto;
    color: #000;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.3rem, 4vw, 1.6rem);
    font-weight: 900; letter-spacing: .1em; text-transform: uppercase;
    padding: 1.1rem 4rem;
    border-radius: 999px;
    border: none; cursor: pointer;
    text-decoration: none;
    box-shadow:
      0 0 30px rgba(201,150,58,.55),
      0 4px 20px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.3);
    animation: shimmerGold 3s linear infinite, pulseGlow 2.5s ease-in-out infinite;
    transition: transform .15s, filter .15s;
  }
  .btn-cta:hover { transform: scale(1.04) translateY(-2px); filter: brightness(1.1); }
  .btn-cta:active { transform: scale(.97); }

  .hand-icon {
    width: 38px; height: 38px;
    background: rgba(0,0,0,.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .cta-note {
    font-size: .65rem;
    color: rgba(255,255,255,.35);
    display: flex; align-items: center; gap: .3rem;
  }

  @keyframes shimmerGold {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(201,150,58,.55), 0 4px 20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.3); }
    50%       { box-shadow: 0 0 55px rgba(240,192,80,.75), 0 6px 28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.3); }
  }

  /* ══ RESPONSIVE: stack on mobile ══ */
  @media (max-width: 600px) {
    .composition {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      min-height: auto;
      gap: 1rem;
    }
    .col-center {
      width: min(280px, 80vw);
      height: min(280px, 80vw);
      order: 1;
      margin: 0 auto;
    }
    .col-left {
      order: 2;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .col-right {
      order: 3;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .card-stars, .card-reviews { min-width: 120px; }
    .card-promo { min-width: 140px; flex: 1 1 140px; }
    .btn-cta { padding: 1rem 2.5rem; }
  }
</style>
</head>
<body>

<div class="scene">

  <!-- HEADER -->
  <div class="scene-header">
    <div class="brand-row">
      <div class="brand-icon">V</div>
      <span class="brand-name">Voltra</span>
    </div>
    <h1 class="scene-title">
      Aspiradora Sopladora Voltra<br>
      <span class="gold">3-en-1 Black Edition</span>
    </h1>
    <div class="badge-top">🏆 ¡La tenés que tener!</div>
  </div>

  <!-- MAIN COMPOSITION -->
  <div class="composition">

    <!-- LEFT: estrellas + reseñas -->
    <div class="col-left">

      <div class="card-stars">
        <div class="star-icon">⭐</div>
        <span class="star-num">4.6</span>
        <span class="star-label">Estrellas</span>
        <div class="stars-row">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
      </div>

      <div class="card-reviews">
        <div class="review-icon">👍</div>
        <span class="review-num">+300</span>
        <span class="review-label">Reseñas<br>Reales</span>
      </div>

    </div>

    <!-- CENTER: producto -->
    <div class="col-center">
      <div class="product-glow"></div>
      <div class="product-platform">
        <div class="platform-ring"></div>
      </div>
      <img
        class="product-img"
        src="/imagen-transparente.png"
        alt="Aspiradora Sopladora Voltra 3-en-1 Black Edition"
        loading="eager"
        fetchpriority="high"
      />
    </div>

    <!-- RIGHT: cuotas + envío + descuento -->
    <div class="col-right">

      <div class="card-promo">
        <div class="promo-icon">💳</div>
        <div class="promo-text">
          <span class="promo-val">12 Cuotas</span>
          <span class="promo-desc">Sin Interés</span>
        </div>
      </div>

      <div class="card-promo">
        <div class="promo-icon">🚚</div>
        <div class="promo-text">
          <span class="promo-val">¡Envío Gratis!</span>
          <span class="promo-desc">A Todo el País</span>
        </div>
      </div>

      <div class="card-promo" style="gap:.5rem;">
        <div class="card-discount">
          <span class="disc-pct">48%</span>
          <span class="disc-label">OFF</span>
        </div>
        <div class="promo-text">
          <span class="promo-val">48% OFF</span>
          <span class="promo-desc">Descuento hoy</span>
        </div>
      </div>

    </div>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <a class="btn-cta" href="#" aria-label="Comprar Aspiradora Voltra">
      🛒 Comprar Ahora
      <div class="hand-icon">👆</div>
    </a>
    <p class="cta-note">🔒 Compra segura · Garantía Oficial Voltra</p>
  </div>

</div>

</body>
</html>
